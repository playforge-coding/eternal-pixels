name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "crates/**"
      - "tools/docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time. Let an in-flight one finish so Pages is
# never left half updated.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.5.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # The registry, and the rustdoc build of the dependencies (Skia among
      # them), are worth keeping between runs.
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/api-docs
          key: api-docs-${{ runner.os }}-${{ hashFiles('crates/*/Cargo.lock') }}
          restore-keys: |
            api-docs-${{ runner.os }}-

      - name: Build book
        run: mdbook build docs

      # After the book, since mdBook empties its output directory. Lands in
      # docs/book/api, so the reference is served at <pages>/api/.
      - name: Build API reference
        run: tools/docs/build-api.sh

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
